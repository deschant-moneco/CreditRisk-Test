[project]
name = "creditrisk-test"
version = "1.0.0"
description = "Qualification d'un système IA d'estimation du risque de défaut (microfinance)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "demo_echec: test volontairement défaillant (démonstration CI, activé par CREDITRISK_DEMO_ECHEC=1)",
]
filterwarnings = [
    # avertissement de dépendance (starlette 1.x recommande httpx2) : sans impact sur les tests
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app", "ml"]
# scripts d'outillage (entraînement, génération de données) exclus de la mesure
omit = ["ml/train.py", "ml/data.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "B017"]
